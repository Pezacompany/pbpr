<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Imigracyjny</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top left, #1a1c2c, #09090b);
            overflow: hidden;
        }
        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-btn {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            transition: 0.3s;
        }
        .glow-btn:hover { box-shadow: 0 0 35px rgba(59, 130, 246, 0.7); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen text-white">

    <div class="glass p-10 rounded-3xl w-full max-w-md shadow-2xl relative z-10">
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold tracking-tighter mb-2 italic">WNIOSEK O OBYWATELSTWO</h1>
            <p class="text-gray-400 text-sm">Wprowadź dane swojej postaci IC</p>
        </div>

        <form id="verifyForm" class="space-y-5">
            <input type="hidden" name="state" id="discordIdInput">

            <div>
                <label class="block text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1 ml-1">Użytkownik Roblox</label>
                <input type="text" name="username" placeholder="Nick z gry..." required 
                class="w-full bg-black/50 border border-white/10 p-3 rounded-xl outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1 ml-1">Imię i Nazwisko (IC)</label>
                <input type="text" name="charName" placeholder="Np. Jan Kowalski" required 
                class="w-full bg-black/50 border border-white/10 p-3 rounded-xl outline-none focus:border-blue-500 transition">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1 ml-1">Wiek</label>
                    <input type="number" name="age" placeholder="Lat..." required 
                    class="w-full bg-black/50 border border-white/10 p-3 rounded-xl outline-none focus:border-blue-500 transition">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-1 ml-1">Pochodzenie</label>
                    <input type="text" name="origin" placeholder="Miasto..." required 
                    class="w-full bg-black/50 border border-white/10 p-3 rounded-xl outline-none focus:border-blue-500 transition">
                </div>
            </div>

            <button type="submit" class="w-full py-4 bg-blue-600 rounded-2xl font-bold text-white glow-btn uppercase tracking-wider mt-4">
                Zatwierdź Dokumenty
            </button>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        document.getElementById('discordIdInput').value = urlParams.get('id');

        document.getElementById('verifyForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            
            Swal.fire({ title: 'Weryfikacja...', text: 'Sprawdzamy Twój profil Roblox', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

            // Wysyłamy do backendu Vercel
            const response = await fetch(`/api/verify?${new URLSearchParams(data)}`);
            const result = await response.text();

            if (response.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'WERYFIKACJA POMYŚLNA',
                    text: 'Otrzymałeś obywatelstwo! Za chwilę zostaniesz przekierowany.',
                    timer: 3000,
                    showConfirmButton: false
                }).then(() => {
                    window.location.href = "https://discord.com/channels/YOUR_GUILD_ID"; // Opcjonalnie link do serwera
                });
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'BŁĄD WERYFIKACJI',
                    html: result
                });
            }
        };
    </script>
</body>
</html>
