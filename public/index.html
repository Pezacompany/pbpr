<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weryfikacja | Buckingham RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle, #1a1a1a 0%, #0d0d0d 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 { color: #00A2FF; margin-bottom: 10px; font-size: 24px; }
        p { color: #ccc; font-size: 14px; line-height: 1.6; }
        .code-box {
            background: #000;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #00A2FF;
            font-family: monospace;
            font-size: 18px;
            color: #00FF00;
            margin: 20px 0;
            letter-spacing: 2px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        input:focus { background: rgba(255,255,255,0.2); box-shadow: 0 0 10px #00A2FF; }
        button {
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            border: none;
            border-radius: 8px;
            background: #00A2FF;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background: #0082cc; transform: translateY(-2px); }
        .footer { margin-top: 20px; font-size: 10px; color: #555; text-transform: uppercase; }
    </style>
</head>
<body>

<div class="container" id="verify-box">
    <h1>BUCKINGHAM RP</h1>
    <p>Aby połączyć konto, wklej poniższy kod do swojego profilu Roblox w sekcji <b>"O mnie" (About)</b>:</p>
    
    <div class="code-box" id="display-code">Ładowanie...</div>
    
    <p>Następnie wpisz swój nick z Robloxa:</p>
    <input type="text" id="rbx-nick" placeholder="Twój nick na Roblox...">
    
    <button onclick="startVerify()">Zatwierdź weryfikację</button>
    
    <div class="footer">System weryfikacji v2.0</div>
</div>

<script>
    // Pobieramy ID Discorda z adresu URL
    const urlParams = new URLSearchParams(window.location.search);
    const discordId = urlParams.get('id');
    const status = urlParams.get('status');
    const nick = urlParams.get('name');

    if (status === 'success') {
        document.getElementById('verify-box').innerHTML = `
            <h1 style="color: #00FF00;">SUKCES!</h1>
            <p>Konto <b>${nick}</b> zostało zweryfikowane.</p>
            <p>Możesz już zamknąć tę stronę i wrócić na Discorda.</p>
        `;
    }

    if (discordId) {
        document.getElementById('display-code').innerText = `BCK-${discordId}`;
    } else {
        document.getElementById('display-code').innerText = "BŁĄD: Otwórz link z Discorda!";
        document.getElementById('display-code').style.color = "red";
    }

    function startVerify() {
        const username = document.getElementById('rbx-nick').value;
        if (!username) return alert("Wpisz swój nick!");
        if (!discordId) return alert("Brak ID Discorda! Uruchom link ponownie z Discorda.");
        
        // Przekierowanie do API
        window.location.href = `/api/verify?username=${username}&state=${discordId}`;
    }
</script>

</body>
</html>
