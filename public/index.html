<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weryfikacja | Buckingham RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
        }
        h1 { margin-bottom: 10px; font-weight: 800; letter-spacing: 1px; }
        p { opacity: 0.8; margin-bottom: 30px; }
        .btn-verify {
            background: #00A2FF;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0, 162, 255, 0.4);
            text-decoration: none;
            display: inline-block;
        }
        .btn-verify:hover {
            background: #008bdb;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 162, 255, 0.6);
        }
        .hidden { display: none; }
        .success-icon { color: #4BB543; font-size: 50px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container" id="verify-ui">
        <h1>BUCKINGHAM RP</h1>
        <p>Aby otrzymać dostęp do kanałów, musisz zweryfikować swoje konto Roblox.</p>
        <button class="btn-verify" onclick="processVerification()">Zaloguj przez Roblox</button>
    </div>

    <div class="container hidden" id="success-ui">
        <div class="success-icon">✓</div>
        <h1>GOTOWE!</h1>
        <p>Weryfikacja zakończona pomyślnie. Witaj, <span id="player-name" style="color: #00A2FF; font-weight: bold;"></span>!</p>
        <p style="font-size: 0.8em;">Możesz już zamknąć tę kartę i wrócić na Discorda.</p>
    </div>

    <script>
        // SPRAWDZANIE STATUSU PO POWROCIE
        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('status') === 'success') {
                document.getElementById('verify-ui').classList.add('hidden');
                document.getElementById('success-ui').classList.remove('hidden');
                document.getElementById('player-name').innerText = urlParams.get('name');
            }
        };

        function processVerification() {
            const urlParams = new URLSearchParams(window.location.search);
            const discordId = urlParams.get('id');

            if (!discordId) {
                alert("Błąd: Link musi zawierać Twoje ID Discorda! Kliknij link z bota.");
                return;
            }

            // TWOJE DANE Z ROBLOX OAUTH2
            const clientId = "5490810913407316280";
            const redirect = encodeURIComponent("https://pbpr.vercel.app/api/verify");
            
            // Profesjonalne przekierowanie
            const robloxUrl = `https://apis.roblox.com/oauth/v1/authorize?client_id=${clientId}&redirect_uri=${redirect}&scope=openid%20profile&response_type=code&state=${discordId}`;
            
            window.location.href = robloxUrl;
        }
    </script>
</body>
</html>
