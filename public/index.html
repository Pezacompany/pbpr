<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weryfikacja | Buckingham RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00A2FF;
            --accent: #00fbff;
            --success: #00ff88;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #000;
        }

        /* Tło z Twojego linku */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), 
                        url('https://media.discordapp.net/attachments/1493713102368280680/1494050832533164155/image.png?format=webp&quality=lossless');
            background-size: cover;
            background-position: center;
            z-index: -1;
            transform: scale(1.1);
        }

        .container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            position: relative;
        }

        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 26px;
            letter-spacing: 3px;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 30px;
        }

        /* Pasek postępu */
        .progress-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .dot {
            width: 40px;
            height: 4px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            transition: 0.4s;
        }
        .dot.active { background: var(--primary); box-shadow: 0 0 10px var(--primary); }

        /* Sekcje kroków */
        .step { display: none; animation: slideIn 0.4s ease-out; }
        .step.active { display: block; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        p { color: #ccc; font-size: 14px; margin-bottom: 20px; line-height: 1.5; }

        .code-display {
            background: rgba(0,0,0,0.5);
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed var(--primary);
            font-family: monospace;
            font-size: 22px;
            color: var(--accent);
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 15px;
        }
        .code-display:hover { background: rgba(0, 162, 255, 0.1); }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            text-align: center;
            font-size: 16px;
            margin-bottom: 20px;
            outline: none;
        }
        input:focus { border-color: var(--primary); }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            letter-spacing: 1px;
        }
        .btn:hover { background: #008ae6; transform: translateY(-2px); }

        .btn-secondary { background: rgba(255,255,255,0.1); margin-top: 10px; font-size: 12px; }

        .success-v { font-size: 50px; color: var(--success); margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="background"></div>

<div class="container">
    <h1>Buckingham RP</h1>

    <div class="progress-bar" id="progress">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

    <div class="step active" id="step1">
        <p>Skopiuj poniższy kod i wklej go do swojego profilu Roblox w sekcji <b>"O mnie"</b>.</p>
        <div class="code-display" id="display-code" onclick="copyCode()">Ładowanie...</div>
        <p style="font-size: 11px; color: #888;">Kliknij kod, aby skopiować</p>
        <button class="btn" onclick="nextStep(2)">Skopiowałem, dalej</button>
    </div>

    <div class="step" id="step2">
        <p>Teraz wpisz swoją nazwę użytkownika (Username) z Robloxa:</p>
        <input type="text" id="rbx-nick" placeholder="Twój nick...">
        <button class="btn" onclick="startVerify()">Zakończ weryfikację</button>
        <button class="btn btn-secondary" onclick="nextStep(1)">Wróć</button>
    </div>

    <div class="step" id="step3">
        <div class="success-v">✓</div>
        <h2 style="margin-bottom: 10px;">Gotowe!</h2>
        <p id="success-text">Twoje konto zostało zweryfikowane. Możesz zamknąć tę stronę.</p>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const discordId = urlParams.get('id');

    // Ustawienie kodu na start
    if (discordId) {
        document.getElementById('display-code').innerText = `BCK-${discordId}`;
    } else {
        document.getElementById('display-code').innerText = "BŁĄD";
    }

    // Jeśli wróciliśmy z API z sukcesem
    if (urlParams.get('status') === 'success') {
        showStep(3);
        document.getElementById('success-text').innerText = `Obywatel ${urlParams.get('name')} został pomyślnie zweryfikowany!`;
    }

    function nextStep(step) {
        showStep(step);
    }

    function showStep(stepNumber) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.dot').forEach((d, index) => {
            if (index < stepNumber) d.classList.add('active');
            else d.classList.remove('active');
        });
        document.getElementById('step' + stepNumber).classList.add('active');
    }

    function copyCode() {
        const code = document.getElementById('display-code').innerText;
        navigator.clipboard.writeText(code);
        alert("Kod skopiowany!");
    }

    function startVerify() {
        const username = document.getElementById('rbx-nick').value;
        if (!username) return alert("Wpisz swój nick!");
        
        // Animacja ładowania na przycisku
        const btn = event.target;
        btn.innerText = "Sprawdzanie...";
        btn.disabled = true;

        window.location.href = `/api/verify?username=${username}&state=${discordId}`;
    }
</script>

</body>
</html>
