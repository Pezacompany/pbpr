<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreator Postaci | Buckingham RP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00A2FF; --accent: #00fbff; --bg: #0a0a0a; }
        body { font-family: 'Montserrat', sans-serif; background: var(--bg); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .background { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)), url('https://cdn.discordapp.com/attachments/1493713102368280680/1494050832533164155/image.png'); background-size: cover; z-index: -1; }
        .container { background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); padding: 40px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 500px; text-align: center; }
        .step { display: none; } .step.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        h1 { font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.3); color: white; }
        .btn { background: var(--primary); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; font-weight: 700; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn:hover { background: var(--accent); transform: translateY(-2px); }
        .code-box { background: rgba(0,0,0,0.5); padding: 20px; border-radius: 10px; border: 1px dashed var(--primary); font-size: 22px; margin-bottom: 20px; letter-spacing: 3px; }
    </style>
</head>
<body>
<div class="background"></div>
<div class="container">
    <h1>Buckingham RP</h1>
    
    <div class="step active" id="step1">
        <p>Skopiuj kod do Bio na Roblox:</p>
        <div class="code-box" id="display-code">Ładowanie...</div>
        <button class="btn" onclick="nextStep(2)">Wkleiłem, Dalej</button>
    </div>

    <div class="step" id="step2">
        <h3>Kreator Obywatela</h3>
        <p style="font-size: 11px; color: var(--accent);">Wybierz dane z oficjalnej listy serwerowej</p>
        <input type="text" id="rbx-nick" placeholder="Nick Roblox (Username)">
        <input type="text" id="rp-name" placeholder="Imię i Nazwisko (z listy)">
        <input type="number" id="rp-age" placeholder="Wiek postaci">
        <input type="text" id="rp-origin" placeholder="Pochodzenie (z listy)">
        <button class="btn" onclick="finish()">Stwórz Postać</button>
    </div>

    <div id="status-box"></div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const discordId = urlParams.get('id');
    if(discordId) document.getElementById('display-code').innerText = `BCK-${discordId}`;

    function nextStep(s) {
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step'+s).classList.add('active');
    }

    function finish() {
        const data = {
            username: document.getElementById('rbx-nick').value,
            charName: document.getElementById('rp-name').value,
            age: document.getElementById('rp-age').value,
            origin: document.getElementById('rp-origin').value,
            state: discordId
        };
        if(!data.username || !data.charName || !data.age || !data.origin) return alert("Uzupełnij wszystko!");
        window.location.href = `/api/verify?${new URLSearchParams(data).toString()}`;
    }

    if(urlParams.get('status')) {
        document.getElementById('step1').classList.remove('active');
        const box = document.getElementById('status-box');
        if(urlParams.get('status') === 'success') box.innerHTML = "<h2>✅ GOTOWE</h2><p>Postać stworzona!</p>";
        else box.innerHTML = `<h2 style='color:red'>❌ BŁĄD</h2><p>${urlParams.get('msg')}</p>`;
    }
</script>
</body>
</html>
