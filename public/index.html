<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buckingham Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f1113; color: #e1e1e1; font-family: sans-serif; }
        .card { background-color: #1a1d21; border: 1px solid #2d3136; }
        input { background-color: #0f1113; border: 1px solid #2d3136; color: white; }
        button { background-color: #ffffff; color: #000000; transition: 0.2s; }
        button:hover { background-color: #cccccc; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">
    <div class="card p-8 rounded-lg w-full max-w-sm">
        <h2 class="text-xl font-bold mb-6 text-center border-b border-gray-700 pb-4">WERYFIKACJA OBYWATELSTWA</h2>
        
        <div id="step1">
            <label class="block text-xs uppercase mb-2 text-gray-500">Nick Roblox</label>
            <input type="text" id="nick" class="w-full p-2 rounded mb-4 outline-none">
            <button onclick="next()" class="w-full p-2 rounded font-bold">KONTYNUUJ</button>
        </div>

        <div id="step2" class="hidden">
            <label class="block text-xs uppercase mb-2 text-gray-500">Imię i Nazwisko IC</label>
            <input type="text" id="name" class="w-full p-2 rounded mb-3 outline-none">
            <label class="block text-xs uppercase mb-2 text-gray-500">Wiek</label>
            <input type="number" id="age" class="w-full p-2 rounded mb-3 outline-none">
            <label class="block text-xs uppercase mb-2 text-gray-500">Pochodzenie</label>
            <input type="text" id="origin" class="w-full p-2 rounded mb-6 outline-none">
            <button onclick="submit()" class="w-full p-2 rounded font-bold">ZATWIERDŹ POSTAĆ</button>
        </div>
    </div>

    <script>
        const discordId = new URLSearchParams(window.location.search).get('id');
        function next() {
            if(!document.getElementById('nick').value) return;
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }
        async function submit() {
            const data = {
                discordId,
                robloxNick: document.getElementById('nick').value,
                robloxId: "0", // Tu wstaw logiczne pobieranie ID przez proxy jeśli potrzebujesz
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                origin: document.getElementById('origin').value
            };
            await fetch('http://TWOJE_IP_ICEHOST:3000/api/verify', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            alert("Zakończono. Możesz zamknąć kartę.");
        }
    </script>
</body>
</html>
